[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidepool"
version = "0.3.0"
description = "Fast, searchable logs for small teams"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.scripts]
tidepool = "tidepool.cli:main"
